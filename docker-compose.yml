services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DAGSTER_PG_USERNAME:-dagster}
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD:-dagster}
      POSTGRES_DB: ${DAGSTER_PG_DB:-dagster}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    entrypoint:
      - '/bin/sh'
      - '-c'
      - 'mkdir -p /data/uploads && minio server /data --console-address ":9001"'
    volumes:
      - minio_data:/data

  dagster-code:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    image: ndagster-dagster
    command: dagster code-server start -h 0.0.0.0 -p 4000 -m ndagster.definitions
    env_file: .env
    environment:
      DAGSTER_PG_HOST: postgres
      AWS_ENDPOINT_URL: http://minio:9000
    volumes:
      - dagster_storage:/opt/dagster/dagster_home/storage
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    image: ndagster-dagster
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/dagster_home/workspace.yaml
    env_file: .env
    environment:
      DAGSTER_PG_HOST: postgres
      AWS_ENDPOINT_URL: http://minio:9000
    ports:
      - 3000:3000
    volumes:
      - dagster_storage:/opt/dagster/dagster_home/storage
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_started

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    image: ndagster-dagster
    command: dagster-daemon run -w /opt/dagster/dagster_home/workspace.yaml
    env_file: .env
    environment:
      DAGSTER_PG_HOST: postgres
      AWS_ENDPOINT_URL: http://minio:9000
    volumes:
      - dagster_storage:/opt/dagster/dagster_home/storage
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_started

  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    env_file: .env
    environment:
      AWS_ENDPOINT_URL: http://minio:9000
    ports:
      - 3001:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - minio

volumes:
  postgres_data:
  minio_data:
  grafana_data:
  dagster_storage:
