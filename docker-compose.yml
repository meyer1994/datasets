services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${DAGSTER_PG_USERNAME}
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD}
      POSTGRES_DB: ${DAGSTER_PG_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    entrypoint:
      - '/bin/sh'
      - '-c'
      - 'mkdir -p /data/uploads && minio server /data --console-address ":9001"'
    volumes:
      - minio_data:/data

  dagster-code:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    image: ndagster-dagster
    command: dagster code-server start -h 0.0.0.0 -p 4000 -m ndagster.definitions --location-name ndagster
    env_file: .env
    volumes:
      - dagster_storage:/opt/dagster/dagster_home/storage
    restart: unless-stopped
    depends_on:
      - postgres
      - minio

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    image: ndagster-dagster
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/dagster_home/workspace.yaml
    env_file: .env
    ports:
      - 3000:3000
    volumes:
      - dagster_storage:/opt/dagster/dagster_home/storage
    restart: unless-stopped
    depends_on:
      - postgres
      - dagster-code

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    image: ndagster-dagster
    command: dagster-daemon run -w /opt/dagster/dagster_home/workspace.yaml
    env_file: .env
    volumes:
      - dagster_storage:/opt/dagster/dagster_home/storage
    restart: unless-stopped
    depends_on:
      - postgres
      - dagster-code

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    env_file: .env
    restart: unless-stopped

  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    env_file: .env
    ports:
      - 4000:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - minio

volumes:
  postgres_data:
  minio_data:
  grafana_data:
  dagster_storage:
