services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${DAGSTER_PG_USERNAME}
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD}
      POSTGRES_DB: ${DAGSTER_PG_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    env_file: .env
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    entrypoint:
      - '/bin/sh'
      - '-c'
      - 'mkdir -p /data/uploads && exec /entrypoint.sh /data'
    volumes:
      - rustfs_data:/data
    restart: unless-stopped

  dagster-code:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    image: ndagster-dagster
    command: dagster code-server start -h 0.0.0.0 -p 4000 -m ndagster.definitions --location-name ndagster
    env_file: .env
    volumes:
      - dagster_storage:/opt/dagster/dagster_home/storage
    restart: unless-stopped
    depends_on:
      - postgres
      - rustfs

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    image: ndagster-dagster
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/dagster_home/workspace.yaml
    env_file: .env
    ports:
      - 3000:3000
    volumes:
      - dagster_storage:/opt/dagster/dagster_home/storage
    restart: unless-stopped
    depends_on:
      - postgres
      - dagster-code

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    image: ndagster-dagster
    command: dagster-daemon run -w /opt/dagster/dagster_home/workspace.yaml
    env_file: .env
    volumes:
      - dagster_storage:/opt/dagster/dagster_home/storage
    restart: unless-stopped
    depends_on:
      - postgres
      - dagster-code

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --edge-ip-version='4' run
    env_file: .env
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8

  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    env_file: .env
    ports:
      - 4000:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - rustfs

volumes:
  postgres_data:
  rustfs_data:
  grafana_data:
  dagster_storage:
