[project]
name = "ndagster"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.25",
    "dagster-polars>=0.27.12",
    "dagster-postgres>=0.29.25",
    "duckdb>=1.5.6",
    "httpx2>=2.13.1",
    "polars>=1.44.2",
    "s3fs>=2026.9.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "ndagster"
registry_modules = [
    "ndagster.components.*",
]


