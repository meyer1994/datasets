apiVersion: 1

datasources:
  - name: DuckDB
    uid: duckdb-minio
    type: motherduck-duckdb-datasource
    isDefault: true
    jsonData:
      path: ""
      initSql: >-
        SET home_directory = '/var/lib/grafana';
        INSTALL httpfs;
        LOAD httpfs;
        CREATE OR REPLACE SECRET rustfs (
          TYPE s3,
          KEY_ID '${AWS_ACCESS_KEY_ID}',
          SECRET '${AWS_SECRET_ACCESS_KEY}',
          ENDPOINT 'rustfs:9000',
          URL_STYLE 'path',
          USE_SSL false
        );
